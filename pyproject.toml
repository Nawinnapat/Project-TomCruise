[project]
name = "tomcruise-dbd-extractor"
version = "0.1.0"
description = "DBD DataWarehouse company extraction system"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "openpyxl>=3.1.0",
  "cryptography>=42.0.0",
  "playwright>=1.60.0",
  "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
